name: Windows build and installer
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build LRMeetingAI.sln -c Release
      - name: Verify audio meters
        run: dotnet run --project tests/LRMeeting.AudioChecks -c Release --no-build
      - name: Install Inno Setup if needed
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --version=6.6.1 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          }
      - name: Publish and build installer
        shell: pwsh
        run: ./scripts/Build-Windows.ps1
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: LRMeetingAI-installer-win-x64
          path: artifacts/installer/*.exe
          if-no-files-found: error
      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: LRMeetingAI-portable-win-x64
          path: artifacts/publish/
          if-no-files-found: error
