name: Windows build and installer
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build LRMeetingAI.sln -c Release
      - name: Verify audio meters
        run: dotnet run --project tests/LRMeeting.AudioChecks -c Release --no-build
      - name: Verify persistence and AI pipeline
        run: dotnet run --project tests/LRMeeting.CoreChecks -c Release --no-build
      - name: Install Inno Setup if needed
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --version=6.6.1 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          }
      - name: Publish and build installer
        shell: pwsh
        run: ./scripts/Build-Windows.ps1 -IncludeAI
      - name: Install and smoke test Windows application
        shell: pwsh
        run: ./scripts/Test-Windows.ps1
      - name: Upload UI verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LRMeetingAI-interface-preview
          path: |
            artifacts/smoke-*.png
            artifacts/smoke-*.txt
            artifacts/smoke-data/smoke-error.log
          if-no-files-found: warn
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: LRMeetingAI-installer-win-x64
          path: artifacts/installer/*
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
