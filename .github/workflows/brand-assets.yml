name: Official narssus brand reference
on:
  push:
    branches: [codex/narssus-original-assets]
    paths: [.github/workflows/brand-assets.yml]
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - name: Download public original assets
        run: |
          mkdir reference
          curl --fail --location --max-time 30 https://narssus.com/ -o reference/index.html
          curl --fail --location --max-time 30 https://narssus.com/wp-content/themes/narssus-vision/assets/symbol.svg -o reference/symbol.svg
          curl --fail --location --max-time 30 https://narssus.com/wp-content/uploads/2026/10/Sin-titulo-1.png -o reference/narssus-logo.png
          curl --fail --location --max-time 30 https://narssus.com/wp-content/themes/narssus-vision/assets/style.css -o reference/style.css
      - uses: actions/upload-artifact@v4
        with:
          name: narssus-original-reference
          path: reference/
          retention-days: 7
